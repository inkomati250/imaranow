<footer class="bg-gray-800 text-white mt-12 pt-10 pb-6">
  <div class="container mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">

    <!-- Categories Column -->
    <div>
      <h3 class="text-lg font-semibold mb-4">Categories</h3>
      <ul class="space-y-2">
        {% for cat in featured_categories %}
          <li>
            <a href="{% url 'category_view' cat.slug %}" class="hover:underline">
              {{ cat.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>

    <!-- Latest Articles Column -->
    <div>
      <h3 class="text-lg font-semibold mb-4">Latest News</h3>
      <ul class="space-y-2">
        {% for article in latest_articles %}
          <li>
            <a href="{% url 'article_detail' article.slug %}" class="hover:underline">
              {{ article.title|truncatechars:50 }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>

    <!-- Social & Contact Column -->
    <div>
      <h3 class="text-lg font-semibold mb-4">Follow Us</h3>
      <div class="flex space-x-4 mb-4">
        <a href="#" class="hover:text-red-500">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><!-- FB icon --></svg>
        </a>
        <a href="#" class="hover:text-red-500">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><!-- Twitter icon --></svg>
        </a>
        <a href="#" class="hover:text-red-500">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><!-- Instagram icon --></svg>
        </a>
      </div>
      <div class="space-x-4">
        <a href="#" class="hover:underline text-sm">About</a>
        <a href="#" class="hover:underline text-sm">Privacy Policy</a>
        <a href="#" class="hover:underline text-sm">Contact</a>
      </div>
    </div>

  </div>

  <!-- Bottom copyright -->
  <div class="mt-8 border-t border-gray-700 pt-4 text-center text-sm">
    &copy; {% now "Y" %} ImaraNow. All rights reserved.
</div>

</footer>
